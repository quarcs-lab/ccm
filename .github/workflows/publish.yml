on:
  push:
    branches: [main]
  workflow_dispatch:

name: Render and Publish

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Cache renv library
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/renv
          key: renv-${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: |
            renv-${{ runner.os }}-

      - name: Restore renv from CRAN (bypass setup-renv + PPM rewrite)
        # Background: setup-renv@v2 lets renv rewrite the active repo to PPM
        # (packagemanager.posit.co) on Linux runners. RSPM-noble lags CRAN
        # (e.g. has bslib 0.10.0 while our lockfile pins 0.11.0), causing
        # 404s. ppm.enabled in settings.json was insufficient. The hardest
        # override is RENV_CONFIG_REPOS_OVERRIDE — renv reads it before any
        # other repo resolution and uses ONLY the URL(s) given.
        env:
          RENV_CONFIG_REPOS_OVERRIDE: "CRAN=https://cloud.r-project.org"
          RENV_CONFIG_PPM_ENABLED: "FALSE"
          RENV_PATHS_LIBRARY: renv/library
        run: |
          cat("--- renv environment ---\n")
          cat("RENV_CONFIG_REPOS_OVERRIDE:", Sys.getenv("RENV_CONFIG_REPOS_OVERRIDE"), "\n")
          cat("RENV_CONFIG_PPM_ENABLED:", Sys.getenv("RENV_CONFIG_PPM_ENABLED"), "\n")
          cat("options(repos):\n"); print(getOption("repos"))
          cat("--- bootstrapping renv ---\n")
          install.packages("renv", repos = "https://cloud.r-project.org")
          cat("--- renv::restore() ---\n")
          renv::restore()
        shell: Rscript {0}

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
