on:
  push:
    branches: [main]
  workflow_dispatch:

name: Render and Publish

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        # Note: not using `use-public-rspm: true` because RSPM-noble lags
        # behind CRAN on recent versions (e.g. RSPM has bslib 0.10.0 while
        # our lockfile pins 0.11.0). Falling back to CRAN as the default
        # repo guarantees every lockfile version is reachable. First install
        # is slower (source compilation) but the renv cache below makes
        # subsequent runs fast.

      - name: Restore renv environment
        uses: r-lib/actions/setup-renv@v2

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
