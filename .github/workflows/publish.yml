on:
  push:
    branches: [main]
  workflow_dispatch:

name: Render and Publish

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Add CRAN as fallback repo
        # RSPM ships binary packages quickly but sometimes lags on very recent
        # source versions (e.g. bslib 0.11.0 vs RSPM noble's 0.10.0). Appending
        # CRAN to the PROJECT .Rprofile lets renv try RSPM first (binaries) and
        # fall back to CRAN (source) for whatever RSPM hasn't propagated.
        # Note: must be project .Rprofile, not ~/.Rprofile — R skips ~/.Rprofile
        # whenever a project-local .Rprofile exists.
        run: |
          echo 'options(repos = c(getOption("repos"), CRAN = "https://cloud.r-project.org"))' >> .Rprofile

      - name: Restore renv environment
        uses: r-lib/actions/setup-renv@v2

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
