on:
  push:
    branches: [main]
  workflow_dispatch:

name: Render and Publish

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Cache renv library
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/renv
          key: renv-${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: |
            renv-${{ runner.os }}-

      - name: Restore renv from CRAN (unset RSPM env var)
        # ROOT CAUSE (after 6 prior failures): r-lib/actions/setup-r@v2 sets
        # RSPM=https://packagemanager.posit.co/cran/__linux__/noble/latest as
        # an OS environment variable, regardless of the use-public-rspm flag.
        # renv reads $RSPM directly when resolving package URLs and uses it
        # in preference to options(repos), RENV_CONFIG_REPOS_OVERRIDE, and
        # the ppm.enabled setting. RSPM-noble lags CRAN on bleeding-edge
        # versions (e.g. bslib 0.11.0 vs noble's 0.10.0), so the lookups
        # 404. Setting RSPM to empty + Sys.unsetenv("RSPM") in R disables
        # the rewrite and lets renv fall through to CRAN cloud.
        env:
          RSPM: ""
          RENV_CONFIG_REPOS_OVERRIDE: "https://cloud.r-project.org"
          RENV_CONFIG_PPM_ENABLED: "FALSE"
          RENV_PATHS_LIBRARY: renv/library
        run: |
          Sys.unsetenv("RSPM")
          cat("--- renv environment (post-unset) ---\n")
          cat("RSPM:", Sys.getenv("RSPM", unset = "(unset)"), "\n")
          cat("RENV_CONFIG_REPOS_OVERRIDE:", Sys.getenv("RENV_CONFIG_REPOS_OVERRIDE"), "\n")
          cat("options(repos):\n"); print(getOption("repos"))
          cat("--- bootstrapping renv ---\n")
          install.packages("renv", repos = "https://cloud.r-project.org")
          cat("--- renv::restore() ---\n")
          renv::restore()
        shell: Rscript {0}

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
