on:
  push:
    branches: [main]
  workflow_dispatch:

name: Render and Publish

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Add CRAN as fallback repo
        # RSPM ships binary packages quickly but sometimes lags on very recent
        # source versions (e.g. bslib 0.11.0 not yet mirrored to noble). Adding
        # CRAN as a secondary repo lets renv fall back to source when needed.
        run: |
          echo 'options(repos = c(getOption("repos"), CRAN = "https://cloud.r-project.org"))' >> ~/.Rprofile

      - name: Restore renv environment
        uses: r-lib/actions/setup-renv@v2

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
