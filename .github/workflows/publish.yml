on:
  push:
    branches: [main]
  workflow_dispatch:

name: Render and Publish

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Cache renv library
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/renv
          key: renv-${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: |
            renv-${{ runner.os }}-

      - name: Restore renv from CRAN (bypass setup-renv to avoid PPM rewrite)
        # setup-renv@v2 internally allows renv to rewrite the active repo to
        # Posit Package Manager on Linux runners. RSPM noble lags CRAN on
        # recent versions (e.g. bslib 0.11.0 — RSPM still has 0.10.0), so the
        # rewrite causes lockfile-vs-RSPM mismatches and 404s. Doing restore
        # ourselves with explicit repos + RENV_CONFIG_PPM_ENABLED=FALSE keeps
        # renv pinned to CRAN, where every locked version is available.
        env:
          RENV_CONFIG_PPM_ENABLED: "FALSE"
          RENV_PATHS_LIBRARY: renv/library
        run: |
          options(
            repos = c(CRAN = "https://cloud.r-project.org"),
            renv.config.ppm.enabled = FALSE
          )
          install.packages("renv", repos = "https://cloud.r-project.org")
          renv::restore()
        shell: Rscript {0}

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
