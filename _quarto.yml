project:
  type: book
  output-dir: _book
  pre-render: R/build_chapter_zips.R
  resources:
    - images/cover1.jpg
    - downloads

execute:
  freeze: auto

book:
  title: "Comparative Causal Metrics"
  subtitle: "An Introduction to Regional Impact Evaluation"
  author: "Carlos Mendez"
  date: "2026-05-17"
  date-format: "MMMM D, YYYY [(in progress)]"
  search: true
  page-navigation: true
  repo-url: https://github.com/quarcs-lab/ccm
  repo-branch: main
  repo-actions: [edit, issue]
  sharing: [twitter, linkedin]
  downloads: [pdf]
  favicon: images/favicon.svg
  chapters:
    - index.qmd
    - 01-introduction.qmd
    - 02-interrupted-time-series.qmd
    - 03-basic-diff-in-diff.qmd
    - 04-classical-synthetic-control.qmd
    - 05-structural-bayesian-ts.qmd
    - 06-synthetic-control-prediction-intervals.qmd
    - 07-bayesian-spatial-sc.qmd
    - 08-staggered-did.qmd
    - 09-matrix-completion-and-ife.qmd
    - 10-gsynth.qmd
    - references.qmd

bibliography: references.bib
csl: apa.csl

format:
  html:
    theme:
      dark: darkly
      light: cosmo
    respect-user-color-scheme: false
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    code-copy: hover
    code-overflow: wrap
    highlight-style: github
    smooth-scroll: true
    anchor-sections: true
    link-external-icon: true
    link-external-newwindow: true
    fontsize: 1.05em
    linestretch: 1.6
    mainfont: "Inter"
    monofont: "JetBrains Mono"
    css: custom.css
    mermaid:
      theme: neutral
    page-footer:
      left: "© 2025–2026 Carlos Mendez · Source code [MIT](https://github.com/quarcs-lab/ccm/blob/main/LICENSE)-licensed; book text [CC-BY 4.0](https://creativecommons.org/licenses/by/4.0/)."
      center: "[Comparative Causal Metrics](https://quarcs-lab.github.io/ccm/)"
      right: "[GitHub](https://github.com/quarcs-lab/ccm)"
    include-after-body:
      text: |
        <script>
        document.addEventListener('DOMContentLoaded', function() {
          var tocNav = document.getElementById('TOC');
          if (tocNav) {
            var coverDiv = document.createElement('div');
            coverDiv.id = 'toc-cover-image';
            var img = document.createElement('img');
            img.src = 'images/cover1.jpg';
            img.alt = 'Comparative Causal Metrics';
            coverDiv.appendChild(img);
            tocNav.parentNode.insertBefore(coverDiv, tocNav);
          }
        });
        document.addEventListener('DOMContentLoaded', function() {
          var parts = window.location.pathname.replace(/\/$/, '').split('/');
          var basename = parts[parts.length - 1].replace(/\.html$/, '');
          var m = basename.match(/^(\d{2})-/);
          if (!m) return;
          var btn = document.getElementById('quarto-code-tools-menu');
          if (!btn) return;
          var menu = btn.nextElementSibling;
          if (!menu || !menu.classList.contains('dropdown-menu')) return;
          var divider = document.createElement('li');
          divider.innerHTML = '<hr class="dropdown-divider">';
          menu.appendChild(divider);
          var item = document.createElement('li');
          item.innerHTML = '<a class="dropdown-item" href="downloads/chapter-' +
            m[1] + '.zip" download><i class="bi bi-download"></i> Download chapter (.zip)</a>';
          menu.appendChild(item);
        });
        </script>
  # NOTE: Quarto book projects do not currently support `format: typst`.
  # Book-wide PDF output requires LaTeX. CI installs TinyTeX automatically.
  pdf:
    documentclass: scrreprt
    papersize: a4
    geometry:
      - top=2.5cm
      - bottom=2.5cm
      - left=2.5cm
      - right=2.5cm
    toc: true
    number-sections: true
    colorlinks: true
